# 在独立 Windows 运行器上验证系统时区改动后的调度行为。
name: Desktop native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduled-host-time-zone:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Observe rescheduling after the system timezone changes
        run: node tests/native-desktop/host-scheduled-timezone.mjs
