# 在干净的系统运行器上使用 test.13 的原始构建制品验收。
name: Desktop native verification
run-name: Verify test.13 from build ${{ inputs.build_run }}

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: test.13 构建工作流编号
        required: true
        type: string
      build_sha:
        description: test.13 frontend 提交
        required: true
        type: string
      dmg_sha:
        description: 最终 DMG 的 SHA-256
        required: true
        type: string
      windows_sha:
        description: 最终 NSIS 的 SHA-256
        required: true
        type: string
      linux_sha:
        description: 最终 AppImage 的 SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
            installer: PigClaude-0.0.1-arm64.dmg
            hash_input: dmg_sha
          - runner: windows-2022
            target: win32-x64
            installer: PigClaude-0.0.1-x64.exe
            hash_input: windows_sha
          - runner: ubuntu-24.04
            target: linux-x64
            installer: PigClaude-x86_64.AppImage
            hash_input: linux_sha
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      QA_INSTALLER: ${{ runner.temp }}/pigclaude-test13-artifact/${{ matrix.installer }}
      QA_EXPECTED_SHA: ${{ inputs[matrix.hash_input] }}
      QA_OUTPUT: ${{ runner.temp }}/pigclaude-test13-evidence
      QA_ROOT: ${{ runner.temp }}/pigclaude-test13-installed
      QA_BUILD_SHA: ${{ inputs.build_sha }}
      QA_BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: 核对制品的源码提交
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = "$QA_BUILD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_BUILD_RUN" --jq .head_sha)" = "$QA_BUILD_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ matrix.target }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pigclaude-test13-artifact
      - uses: pnpm/action-setup@v4
        if: runner.os != 'macOS'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        if: runner.os != 'macOS'
      - name: 只读挂载最终 DMG 并核对资源与签名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$QA_OUTPUT"
          actual=$(shasum -a 256 "$QA_INSTALLER" | awk '{print $1}')
          test "$actual" = "$QA_EXPECTED_SHA"
          hdiutil verify "$QA_INSTALLER" > "$QA_OUTPUT/dmg-verify.txt"
          node apps/desktop/verify-macos-dmg-resources.cjs "$QA_INSTALLER" | tee "$QA_OUTPUT/resources-and-signature.txt"
          QA_ACTUAL_SHA="$actual" node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process"
          import { readFileSync, writeFileSync } from "node:fs"
          import { join } from "node:path"
          const log = readFileSync(join(process.env.QA_OUTPUT, "resources-and-signature.txt"), "utf8")
          const result = {
            buildCommit: process.env.QA_BUILD_SHA,
            buildRun: Number(process.env.QA_BUILD_RUN),
            sha256: process.env.QA_ACTUAL_SHA,
            os: "macOS " + execFileSync("sw_vers", ["-productVersion"], { encoding: "utf8" }).trim(),
            arch: process.arch,
            dmgVerified: true,
            codeSignatureDeepStrict: true,
            fixedPigBrowserResources: Number(/已验证 (\d+) 项/.exec(log)?.[1]),
          }
          if (result.fixedPigBrowserResources !== 1040) throw new Error("固定资源计数不符")
          writeFileSync(join(process.env.QA_OUTPUT, "verified.json"), JSON.stringify(result, null, 2) + "\n")
          JS
      - name: 安装 Windows NSIS 并核对系统协议与 Chrome 回跳
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: node tests/native-desktop/test13-installed-desktop.mjs
      - name: 准备 Ubuntu 系统 locale 与 FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends libfuse2t64 fuse3 locales
          sudo localedef -i en_US -f UTF-8 en_US.UTF-8
          sudo localedef -i fr_FR -f UTF-8 fr_FR.UTF-8
          if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: 在最终 AppImage 验证两组原生 CLI Intl
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash tests/native-desktop/test13-installed-linux-intl.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-test13-${{ matrix.target }}
          path: ${{ runner.temp }}/pigclaude-test13-evidence
          if-no-files-found: warn
