# 对修复提交执行同一台 Windows 运行器上的连续检查点恢复验收。
name: Desktop native verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pigcode:verify
      - run: pnpm --filter @pigclaude/desktop build
      - name: Warm up Windows PowerShell
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "(Get-CimInstance -ClassName Win32_ComputerSystemProduct -ErrorAction Stop).UUID" | Out-Null
          pwsh.exe -NoProfile -NonInteractive -File tests/native-desktop/windows-pointer.ps1 capture "$env:RUNNER_TEMP\system-input-warmup.png"
      - name: Verify Git subprocess regression
        run: >-
          pnpm --filter @pigclaude/desktop exec vitest run --maxWorkers=1
          src/main/workbench/git-command-transient.test.ts
          src/main/workbench/git-command.test.ts
          src/main/workbench/session-checkpoints.test.ts
      - name: Restore a real Windows checkpoint ten times in order
        env:
          PIGCLAUDE_CI_CHECKPOINT_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $oldTrace = & git config --global --get trace2.eventTarget
          $hadTrace = $LASTEXITCODE -eq 0
          try {
            for ($iteration = 1; $iteration -le 10; $iteration++) {
              Write-Host "PC164 attempt $iteration"
              $trace = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "pc164-verify-$iteration")
              $log = Join-Path $env:RUNNER_TEMP "pc164-verify-$iteration.log"
              try {
                & git config --global trace2.eventTarget ($trace.FullName.Replace('\', '/'))
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                node tests/native-desktop/acceptance.mjs "test-results/native-desktop/$iteration" 2>&1 | Tee-Object -FilePath $log
                $testExit = $LASTEXITCODE
                node tests/native-desktop/checkpoint-git-diagnostics.mjs $trace.FullName
                $traceExit = $LASTEXITCODE
                if ($testExit -ne 0) { exit $testExit }
                if ($traceExit -ne 0) { exit $traceExit }
                if (-not (Select-String -Quiet -SimpleMatch 'PASS checkpoint restoration preserves project context' -LiteralPath $log)) {
                  throw 'Missing successful checkpoint restoration'
                }
                Write-Host "PC164 verified restore $iteration"
              } finally {
                Remove-Item -LiteralPath $trace.FullName, $log -Force -Recurse -ErrorAction SilentlyContinue
              }
            }
          } finally {
            if ($hadTrace) { & git config --global trace2.eventTarget $oldTrace }
            else { & git config --global --unset trace2.eventTarget }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-native-windows-${{ matrix.trial }}
          path: test-results/native-desktop
          if-no-files-found: warn

  baseline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43689f78b40e51b3823e056b3c140220433cd90d
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reproduce existing worktree-path behavior on the unmodified baseline
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'pc164-baseline-worktree.log'
          pnpm --filter @pigclaude/desktop exec vitest run --maxWorkers=1 src/main/workbench/workbench-git-ipc.test.ts 2>&1 | Tee-Object -FilePath $log
          $baselineExit = $LASTEXITCODE
          if ($baselineExit -eq 0) {
            Write-Host 'PC164 baseline worktree check passed'
            exit 0
          }
          if (
            (Select-String -Quiet -SimpleMatch 'records an existing worktree of the project and refuses any other folder' -LiteralPath $log) -and
            (Select-String -Quiet -SimpleMatch 'WORKBENCH_PATH_INVALID' -LiteralPath $log)
          ) {
            Write-Host 'PC164 baseline worktree check reproduced WORKBENCH_PATH_INVALID'
            exit 0
          }
          exit $baselineExit
