# 隔离验收分支。运行原生插件沙箱并核对回环目标与代理各自收到的连接。
name: Desktop native verification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-plugin-egress:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tests/native-desktop/windows-qa-egress.mjs test-results
      - uses: actions/upload-artifact@v4
        with:
          name: windows-plugin-egress-evidence
          retention-days: 7
          path: test-results/windows-plugin-egress.json
          if-no-files-found: error
