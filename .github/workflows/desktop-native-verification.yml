# 在一次性 Windows 运行器验证真实桌面入口读写统一 OAuth 文件。
name: Desktop native verification
run-name: Windows OAuth session file verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-oauth-file:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: 验证统一文件、刷新屏障和完整桌面 IPC
        working-directory: apps/desktop
        run: |
          node -e "require('electron')"
          pnpm exec vitest run --testTimeout=20000 src/main/authorization/oauth-session-file.test.ts src/main/authorization/oauth-token-manager.test.ts src/main/profile-sign-out-ipc.test.ts
