# 在实际 Windows 和 Ubuntu 运行器启动 Electron 并留存窗口验收证据。
name: Desktop native verification

on:
  push:
    branches: ["main", "codex/pigcode-ui-native-qa", "codex/pigcode-workbench"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pigcode:verify
      - run: pnpm --filter @pigclaude/desktop exec electron --version
        if: runner.os == 'Windows'
      - name: Install Linux display and keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth openbox dbus-x11 gnome-keyring libsecret-tools xdotool imagemagick
      - name: Prepare Linux Electron
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          node -e 'require("electron")'
          electron="$(node -p 'require("electron")')"
          sudo chown root:root "$(dirname "$electron")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$electron")/chrome-sandbox"
          "$electron" --version
      - run: pnpm --filter @pigclaude/desktop build
      # 新运行器上第一次启动 PowerShell 很慢：Windows PowerShell 查询设备标识要 4–13 秒，偶尔超过 20 秒；
      # pwsh 第一次编译 C# 并加载 WinForms 要 6–11 秒。验收测的是界面流程，先各跑一次，不让它算进期限。
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "(Get-CimInstance -ClassName Win32_ComputerSystemProduct -ErrorAction Stop).UUID" | Out-Null
          pwsh.exe -NoProfile -NonInteractive -File tests/native-desktop/windows-pointer.ps1 capture "$env:RUNNER_TEMP\system-input-warmup.png"
      - name: Verify saved session and Claude process lifecycle
        timeout-minutes: 8
        run: >-
          pnpm --filter @pigclaude/desktop exec vitest run --maxWorkers=2
          src/main/session/session-host-persistence.test.ts
          src/main/session/retained-claude-process.test.ts
          src/main/session/retained-claude-process-exit.test.ts
          src/main/session/claude-agent-adapter-retained-process.test.ts
      - name: Verify native Electron on Windows
        if: runner.os == 'Windows'
        run: node tests/native-desktop/acceptance.mjs test-results/native-desktop
      - name: Verify native Electron on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash -euc '
            eval "$(printf "%s\n" pigclaude-native-qa | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            openbox >/tmp/pigclaude-openbox.log 2>&1 &
            sleep 1
            node tests/native-desktop/acceptance.mjs test-results/native-desktop
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-native-${{ runner.os }}
          path: test-results/native-desktop
          if-no-files-found: warn
