# 在独立运行器上定位 GLib 对不同 XDG 命令格式的解析结果。
name: Desktop native verification
run-name: Probe GIO desktop entry formats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gio:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare default association and URI dispatch
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, time
          root = pathlib.Path(tempfile.mkdtemp(prefix='gio-appimage-probe-'))
          mime = "x-scheme-handler/pigclaude-qaprobe"
          uri = "pigclaude-qaprobe://app/callback?code=fixture%2B&state=dummy"
          launcher_id = "qaprobe.desktop"

          def invoke(env, *args):
              p = subprocess.run(args, env=env, text=True, capture_output=True, timeout=8)
              print(" ", args[0], args[1:3], p.returncode, (p.stdout + p.stderr).strip())
              return p

          def quote(value):
              return '"' + ''.join(
                  "%%" if char == "%" else "\\" * 4 if char == "\\" else
                  "\\" * 2 + char if char in ['"', '$', chr(96)] else char
                  for char in value
              ) + '"'

          def attempt(label, wrapper, extra, field, register, cache=False, dbus=False):
              print(label)
              folder = root / label
              data, config = folder / "data", folder / "config"
              apps = data / "applications"
              apps.mkdir(parents=True)
              config.mkdir()
              binary = folder / ("PigClaude 100%=stable.AppImage" if wrapper else "probe-browser")
              binary.write_text('#!/bin/sh\nprintf "%s\\n" "$@" > "$0.args"\n')
              binary.chmod(0o700)
              env = {
                  **os.environ,
                  "LC_ALL": "C",
                  "XDG_DATA_HOME": str(data),
                  "XDG_CONFIG_HOME": str(config),
                  "XDG_CURRENT_DESKTOP": "GNOME",
              }
              if dbus: env.pop("DBUS_SESSION_BUS_ADDRESS", None)
              cmd = ('/bin/sh -c ' + quote('exec "$@"') + ' qaprobe ' if wrapper else "") + quote(str(binary)) + " " + field
              entry = apps / launcher_id
              entry.write_text(f"[Desktop Entry]\nType=Application\nName=QA Probe\n{extra}Exec={cmd}\nMimeType={mime};\n")
              print(" ", str(entry.read_text().splitlines()))
              if cache: invoke(env, "update-desktop-database", str(apps))
              if register == 'gio':
                  invoke(env, "gio", "mime", mime, launcher_id)
              else:
                  invoke(env, "xdg-mime", "default", launcher_id, mime)
              for config_file in (config / "mimeapps.list", apps / "mimeapps.list"):
                  if config_file.exists(): print(" ", str(config_file.read_text().splitlines()))
              invoke(env, "gio", "mime", mime)
              invoke(env, "xdg-mime", "query", "default", mime)
              invoke(env, "gio", "open", uri)
              capture = str(binary) + ".args"
              time.sleep(.12)
              p = pathlib.Path(capture)
              print(" ", "opening delivered", p.read_text().strip() if p.exists() else None)
              p.unlink(missing_ok=True)
              invoke(env, "gio", "launch", str(entry), uri)
              time.sleep(.12)
              print(" ", "explicit delivery", p.read_text().strip() if p.exists() else None)

          attempt("direct-visible-u", False, "", "%u", "gio")
          attempt("direct-hidden-u", False, "NoDisplay=true\n", "%u", "gio")
          attempt("wrapped-visible-u", True, "", "%u", "gio")
          attempt("wrapped-hidden-u", True, "NoDisplay=true\n", "%u", "gio")
          attempt("wrapped-hidden-U", True, "NoDisplay=true\n", "%U", "gio")
          attempt("wrapped-xdg-u", True, "NoDisplay=true\n", "%u", "xdg")
          attempt("wrapped-with-cache-u", True, "NoDisplay=true\n", "%u", "gio", cache=True)
          PY
