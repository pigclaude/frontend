# 在新的 macOS 与 Windows 运行器上安装 test.9 的制品并验收系统授权回跳。
name: Desktop native verification
run-name: Verify test.9 DMG installation on macOS 26

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: darwin-arm64
            installer: PigClaude-0.0.1-arm64.dmg
            sha256: ff831825022f74ac75dc1d1aa050c82287567ea03b0843fc8dfe17c1c32f766d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ matrix.target }}
          run-id: 44020021431
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pigclaude-test9-artifact
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install test.9 and verify Chrome and OS dispatch
        timeout-minutes: 7
        env:
          QA_ROOT: ${{ runner.temp }}/pigclaude-test9-install
          QA_OUTPUT: ${{ runner.temp }}/pigclaude-test9-install-evidence
          QA_INSTALLER: ${{ runner.temp }}/pigclaude-test9-artifact/${{ matrix.installer }}
          QA_EXPECTED_SHA: ${{ matrix.sha256 }}
        run: node tests/native-desktop/test9-installed-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-test9-${{ matrix.target }}
          path: ${{ runner.temp }}/pigclaude-test9-install-evidence
          if-no-files-found: warn
