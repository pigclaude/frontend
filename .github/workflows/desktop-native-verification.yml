# 在 Windows 上比较真实 Git 返回的工作树路径和本机选择使用的路径。
name: Desktop native verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reproduce the worktree selection error using Windows Git
        run: >-
          pnpm --filter @pigclaude/desktop exec vitest run --maxWorkers=1
          src/main/workbench/workbench-git-ipc.test.ts
          -t "records an existing worktree of the project"
