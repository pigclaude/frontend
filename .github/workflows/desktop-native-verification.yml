# 只读核对 Ubuntu 构建环境的官方 Chrome 沙箱助手。
name: Desktop native verification
run-name: Inspect Ubuntu Chrome sandbox for test.15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检查系统 Chrome 助手的来源和权限
        run: |
          command -v google-chrome || true
          google-chrome --version || true
          path=/opt/google/chrome/chrome-sandbox
          stat -Lc '%F %u:%g:%a' "$path" || true
          dpkg-query -S "$path" || true
          dpkg-query -W google-chrome-stable || true
          readlink -f "$path" || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
