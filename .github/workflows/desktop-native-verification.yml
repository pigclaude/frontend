# 隔离验收分支。用已构建的 Windows 解包制品核对真实 15 分钟排期。
name: Desktop native verification
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-background-clock:
    runs-on: windows-2022
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-qa-runtime
          run-id: 44785129087
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/known-runtime
      - name: Verify and extract Windows candidate
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "known-runtime"
          $archive = Join-Path $runtimeDir "PigClaude-windows-qa.zip"
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "0cbfbedb75ffad1c2aaad50eee732884086541515caf4e4997c4247c6ceca887") { throw "Archive mismatch" }
          New-Item -Path "$runtimeDir/extracted" -ItemType Directory | Out-Null
          tar.exe -xf $archive -C "$runtimeDir/extracted"
          if ($LASTEXITCODE -ne 0) { throw "Archive extraction failed" }
      - name: Verify one elapsed native background interval
        timeout-minutes: 25
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "known-runtime/extracted/PigClaude.exe"
          $nodeVersion = (Get-Item $app).VersionInfo.FileVersion
          if ($nodeVersion -ne "0.0.1") { throw "Unexpected file version" }
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          node tests/native-desktop/windows-interval-acceptance.mjs $app "test-results/windows-interval.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-background-interval-evidence
          retention-days: 7
          path: test-results/windows-interval.json
          if-no-files-found: warn
