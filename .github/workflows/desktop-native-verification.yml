# 在一次性运行器从 test.11 的最终安装包验证系统协议、Chrome、SOCKS5 及区域设置。
name: Desktop native verification
run-name: Verify test.11 installed packages, SOCKS5 and Intl

on:
  workflow_dispatch:
    inputs:
      platforms_json:
        description: 本轮验收平台矩阵
        required: true
        type: string
      dmg_sha:
        description: test.11 DMG 的 SHA-256
        required: false
        type: string
      windows_sha:
        description: test.11 NSIS 的 SHA-256
        required: true
        type: string
      linux_sha:
        description: test.11 AppImage 的 SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms_json) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ matrix.target }}
          run-id: 44124290072
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pigclaude-test11-artifact
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare clean Ubuntu desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox dbus-x11 gnome-keyring libglib2.0-bin xdg-utils libfuse2t64 fuse3 xdotool fonts-noto-cjk
          if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
          test -f /usr/share/applications/google-chrome.desktop
      - name: Verify DMG or NSIS installation and runtime
        if: runner.os != 'Linux'
        timeout-minutes: 10
        env:
          QA_ROOT: ${{ runner.temp }}/pigclaude-test11-install
          QA_OUTPUT: ${{ runner.temp }}/pigclaude-test11-evidence
          QA_INSTALLER: ${{ runner.temp }}/pigclaude-test11-artifact/${{ matrix.installer }}
          QA_EXPECTED_SHA: ${{ inputs[matrix.hash_input] }}
        run: node tests/native-desktop/test11-installed-desktop.mjs
      - name: Verify AppImage installation and runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          QA_PACKAGE: ${{ runner.temp }}/pigclaude-test11-artifact
          QA_ROOT: ${{ runner.temp }}/pigclaude-test11-install
          QA_OUTPUT: ${{ runner.temp }}/pigclaude-test11-evidence
          QA_IMAGE: ${{ runner.temp }}/pigclaude-test11-install/PigClaude 100%=stable.AppImage
          QA_BUILD_COMMIT: ${{ runner.temp }}/pigclaude-test11-artifact/build-commit.txt
          QA_SHA256: ${{ runner.temp }}/pigclaude-test11-artifact/SHA256SUMS.txt
          QA_EXPECTED_IMAGE_SHA: ${{ inputs.linux_sha }}
        run: |
          export XDG_CONFIG_HOME="$QA_ROOT/config"
          export XDG_DATA_HOME="$QA_ROOT/data"
          export XDG_CACHE_HOME="$QA_ROOT/cache"
          export XDG_CURRENT_DESKTOP=GNOME
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$QA_OUTPUT"
          printf "%s  %s\n" "$QA_EXPECTED_IMAGE_SHA" PigClaude-x86_64.AppImage >"$QA_SHA256"
          printf "%s\n" 5dd3ef3fd62bf07c37d5c78edfe65cbf3ad07cb5 >"$QA_BUILD_COMMIT"
          mv "$QA_PACKAGE/PigClaude-x86_64.AppImage" "$QA_IMAGE"
          chmod +x "$QA_IMAGE"
          timeout --kill-after=10s 520s xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -euc '
            eval "$(printf "%s\n" pigclaude-test11-qa | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            openbox >"$QA_ROOT/openbox.log" 2>&1 &
            node tests/native-desktop/linux-appimage-protocol-qa.mjs
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-test11-${{ matrix.target }}
          path: ${{ runner.temp }}/pigclaude-test11-evidence
          if-no-files-found: warn
