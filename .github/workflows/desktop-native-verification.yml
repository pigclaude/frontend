# 用独立 Ubuntu x64 运行器验收已打出的 AppImage 和系统协议回跳。
name: Desktop native verification
run-name: Linux AppImage startup and protocol callback (7dc803a)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-linux-x64
          path: ${{ runner.temp }}/pigclaude-artifact
          run-id: 43993199194
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Ubuntu desktop and FUSE
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox dbus-x11 gnome-keyring desktop-file-utils libglib2.0-bin libfuse2t64 fuse3
          if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
          ls -l /dev/fuse
          sysctl kernel.apparmor_restrict_unprivileged_userns
          command -v google-chrome
      - name: Verify AppImage and system URI dispatcher
        env:
          QA_ROOT: ${{ runner.temp }}/pigclaude-appimage-runtime
          QA_IMAGE: ${{ runner.temp }}/pigclaude-artifact/PigClaude-x86_64.AppImage
          QA_OUTPUT: ${{ runner.temp }}/pigclaude-appimage-evidence
        run: |
          chmod +x "$QA_IMAGE"
          export XDG_CONFIG_HOME="$QA_ROOT/config"
          export XDG_DATA_HOME="$QA_ROOT/data"
          export XDG_CACHE_HOME="$QA_ROOT/cache"
          export XDG_CURRENT_DESKTOP=GNOME
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$QA_OUTPUT"
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -euc '
            eval "$(printf "%s\n" pigclaude-appimage-qa | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            openbox >"$QA_ROOT/openbox.log" 2>&1 &
            node tests/native-desktop/linux-appimage-qa.mjs
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-evidence-7dc803a
          path: ${{ runner.temp }}/pigclaude-appimage-evidence
          if-no-files-found: warn
