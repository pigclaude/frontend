# 推版本 tag 时构建三平台安装包和更新清单，冒烟测试后作为草稿发布到 pigclaude/release，维护者确认后公开。
# 手动触发只做测试发布：tag 必须形如 desktop-v0.0.0-test.1，草稿标成预发布并在说明里写明是测试。
name: Desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 测试发布的 tag，例如 desktop-v0.0.0-test.1
        required: true
        type: string

permissions:
  contents: read

env:
  XRAY_VERSION: v26.10.31

concurrency:
  group: desktop-release-${{ github.ref_name }}-${{ inputs.test_tag }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      test: ${{ steps.target.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: target
        env:
          TEST_TAG: ${{ inputs.test_tag }}
        run: node apps/desktop/release-target.cjs >> "$GITHUB_OUTPUT"

  build:
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
            package: --win nsis --x64
            xray_archive: Xray-windows-64.zip
            xray_sha256: 2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a
            executable: release/win-unpacked/PigClaude.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 获取并校验固定 PigBrowser 与 Xray
        shell: pwsh
        env:
          PIGBROWSER_READ_TOKEN: ${{ secrets.PIGBROWSER_READ_TOKEN }}
          TARGET: ${{ matrix.target }}
          XRAY_ARCHIVE: ${{ matrix.xray_archive }}
          XRAY_SHA256: ${{ matrix.xray_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "pigclaude-runtime"
          $browserDir = Join-Path $root "browser"
          $xrayDir = Join-Path $root "xray"
          New-Item -ItemType Directory -Force $browserDir, $xrayDir | Out-Null
          $browserArchive = node apps/desktop/download-pigbrowser.cjs --target $env:TARGET --dir $root
          if ($LASTEXITCODE -ne 0) { throw "获取 PigBrowser 开发包失败，原因见上面的输出" }
          $browserArchive = "$browserArchive".Trim()
          $xrayArchive = Join-Path $root $env:XRAY_ARCHIVE
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/$env:XRAY_ARCHIVE" -OutFile $xrayArchive
          if ((Get-FileHash $xrayArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:XRAY_SHA256) { throw "Xray 包校验失败" }
          if ($IsMacOS) {
            ditto -x -k $browserArchive $browserDir
          } elseif ($IsWindows) {
            Expand-Archive $browserArchive -DestinationPath $browserDir
          } else {
            tar -xf $browserArchive -C $browserDir
          }
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "PigBrowser 包解压失败" }
          Expand-Archive $xrayArchive -DestinationPath $xrayDir
          $packages = @(Get-ChildItem $browserDir -Directory | Where-Object { Test-Path (Join-Path $_.FullName "manifest.json") })
          if ($packages.Count -ne 1) { throw "无法确认唯一 PigBrowser 开发包" }
          node apps/desktop/stage-pigbrowser.cjs --package $packages[0].FullName --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "PigBrowser 完整资源校验失败" }
          $xrayTarget = "apps/desktop/runtime-assets/pigclaude-runtime/xray/$env:TARGET"
          New-Item -ItemType Directory -Force $xrayTarget | Out-Null
          $xrayName = if ($IsWindows) { "xray.exe" } else { "xray" }
          Copy-Item (Join-Path $xrayDir $xrayName), (Join-Path $xrayDir "LICENSE") $xrayTarget
          if (!$IsWindows) { chmod 755 (Join-Path $xrayTarget $xrayName) }
      - run: pnpm --filter @pigclaude/desktop build
      - name: 打包
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config electron-builder.json ${{ matrix.package }} --publish never
      - name: 冒烟测试：解压后的应用能启动，主进程的调试入口已关闭
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        env:
          PIGCLAUDE_TEST_PACKAGED_APP: ${{ github.workspace }}/apps/desktop/${{ matrix.executable }}
        run: pnpm exec vitest run src/main/packaged-debug-entries.integration.test.ts
      - name: 验收实际安装包、系统协议和重装
        shell: pwsh
        timeout-minutes: 8
        run: |
          $scratch = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "pigclaude-6-install")
          node tests/native-desktop/installed-desktop.mjs $scratch.FullName apps/desktop/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
