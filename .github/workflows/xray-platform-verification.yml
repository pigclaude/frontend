# 在 Windows 和 Linux x64 上验证固定 PigBrowser 开发包与 Xray 的桌面集成。
name: Xray platform verification

on:
  workflow_dispatch:
    inputs:
      linux_pigbrowser_url:
        description: 固定 Linux PigBrowser 开发包的下载地址
        required: true
        type: string
      windows_pigbrowser_url:
        description: 固定 Windows PigBrowser 开发包的下载地址
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 获取并校验固定 PigBrowser 与 Xray
        shell: pwsh
        env:
          LINUX_PIGBROWSER_URL: ${{ inputs.linux_pigbrowser_url }}
          WINDOWS_PIGBROWSER_URL: ${{ inputs.windows_pigbrowser_url }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "pigclaude-xray-verification"
          $browserDir = Join-Path $root "browser"
          $xrayDir = Join-Path $root "xray"
          New-Item -ItemType Directory -Force $browserDir, $xrayDir | Out-Null
          $catalog = Get-Content "apps/desktop/pigbrowser-artifacts.json" -Raw | ConvertFrom-Json
          if ($IsWindows) {
            $target = "win32-x64"
            $browserUrl = $env:WINDOWS_PIGBROWSER_URL
            $xrayFile = "Xray-windows-64.zip"
            $xrayHash = "2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a"
            $xrayName = "xray.exe"
          } else {
            $target = "linux-x64"
            $browserUrl = $env:LINUX_PIGBROWSER_URL
            $xrayFile = "Xray-linux-64.zip"
            $xrayHash = "e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214"
            $xrayName = "xray"
          }
          $artifact = $catalog.targets.$target
          if ([string]::IsNullOrWhiteSpace($browserUrl)) { throw "缺少固定 PigBrowser 开发包地址" }
          $browserArchive = Join-Path $root $artifact.archive
          $xrayArchive = Join-Path $root $xrayFile
          Invoke-WebRequest $browserUrl -OutFile $browserArchive
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/$xrayFile" -OutFile $xrayArchive
          if ((Get-FileHash $browserArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw "浏览器包校验失败" }
          if ((Get-FileHash $xrayArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $xrayHash) { throw "Xray 包校验失败" }
          if ($IsWindows) {
            Expand-Archive $browserArchive -DestinationPath $browserDir
          } else {
            tar -xf $browserArchive -C $browserDir
            if ($LASTEXITCODE -ne 0) { throw "浏览器包解压失败" }
          }
          Expand-Archive $xrayArchive -DestinationPath $xrayDir
          $packages = @(Get-ChildItem $browserDir -Directory | Where-Object { Test-Path (Join-Path $_.FullName "manifest.json") })
          if ($packages.Count -ne 1) { throw "无法确认唯一 PigBrowser 开发包" }
          $packageRoot = $packages[0].FullName
          node apps/desktop/stage-pigbrowser.cjs --package $packageRoot --target $target
          if ($LASTEXITCODE -ne 0) { throw "PigBrowser 完整资源校验失败" }
          $staged = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/runtime-assets/pigclaude-runtime/pigbrowser/$target"
          $browser = Join-Path $staged $artifact.executable
          $xray = Join-Path $xrayDir $xrayName
          if (!(Test-Path $xray -PathType Leaf)) { throw "找不到 Xray 入口" }
          if (!$IsWindows) { chmod 755 $xray }
          "PIGCLAUDE_TEST_CHROMIUM_BIN=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIGCLAUDE_TEST_XRAY_BIN=$xray" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIGCLAUDE_TEST_BUILT_WATCHDOG=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIGCLAUDE_TEST_TRUST_TARGET_CERT=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 在临时 Windows 环境信任合成目标证书
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cert = Join-Path $env:GITHUB_WORKSPACE "packages/login-gate/src/test-fixtures/loopback-ip-synthetic-cert.pem"
          $command = Start-Process certutil.exe -ArgumentList @("-f", "-addstore", "Root", "`"$cert`"") -PassThru -NoNewWindow
          if (!$command.WaitForExit(30000)) { $command.Kill(); throw "证书导入超时" }
          if ($command.ExitCode -ne 0) { throw "证书导入失败" }
      - name: 在临时 Linux 环境信任合成目标证书
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libnss3-tools
          fi
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n pigclaude-synthetic -t 'C,,' -i packages/login-gate/src/test-fixtures/loopback-ip-synthetic-cert.pem
      - name: 构建桌面守护程序
        run: pnpm --filter @pigclaude/desktop build
      - name: 验证浏览器、Xray 和代理生命周期
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $files = @(
            "src/main/claude/pigbrowser-locale.integration.test.ts",
            "src/main/claude/fingerprint-chromium-resources.test.ts",
            "src/main/claude/fingerprint-args.test.ts",
            "src/main/claude/browser-startup.test.ts",
            "src/main/claude/browser-extension-paths.test.ts",
            "src/main/claude/browser-extension-readiness.test.ts",
            "src/main/claude/browser-extension-resolver.test.ts",
            "src/main/claude/account-service-startup-cleanup.test.ts",
            "src/main/claude/account-service-startup-callback.test.ts",
            "src/main/claude/subscription-oauth.test.ts",
            "src/main/claude/fingerprint-chromium-startup-failure.test.ts",
            "src/main/claude/fingerprint-chromium-extension-startup.integration.test.ts",
            "src/main/claude/fingerprint-chromium-loopback.integration.test.ts",
            "src/main/claude/fingerprint-chromium-dns-routing.integration.test.ts",
            "src/main/claude/fingerprint-chromium-proxy-auth.integration.test.ts",
            "src/main/claude/fingerprint-chromium-https-proxy.integration.test.ts",
            "src/main/claude/fingerprint-chromium-webrtc.integration.test.ts",
            "src/main/claude/account-service-browser-close.integration.test.ts",
            "src/main/claude/xray-pool.integration.test.ts",
            "src/main/claude/xray-https-proxy-untrusted.integration.test.ts",
            "src/main/claude/xray-egress.test.ts",
            "src/main/claude/ipc.test.ts",
            "src/main/claude/account-service.test.ts",
            "src/renderer/src/app-onboarding.test.ts",
            "src/renderer/src/authorization-preflight.test.ts",
            "src/renderer/src/screens/authorize-screen.test.ts",
            "src/renderer/src/hooks/use-claude-accounts.test.ts",
            "src/renderer/src/screens/onboarding-proxy-pending.test.ts",
            "src/main/claude/xray-crash-recovery.test.ts",
            "src/main/claude/xray-exit-marker.test.ts",
            "src/main/claude/xray-port-reset.test.ts",
            "src/main/claude/xray-windows-watchdog-crash.integration.test.ts",
            "src/main/claude/xray-packaged-watchdog.integration.test.ts",
            "src/main/claude/account-service-xray-oauth.integration.test.ts",
            "src/main/claude/account-service-xray-proxy.integration.test.ts"
          )
          pnpm exec vitest run --maxWorkers=1 @files
          exit $LASTEXITCODE
      - name: 使用真实 HTTP 上游代理验证 HTTPS 目标
        if: github.ref == 'refs/heads/codex/issue9-live-http-proxy'
        working-directory: apps/desktop
        shell: pwsh
        env:
          PIGCLAUDE_TEST_LIVE_HTTP_PROXY: "1"
          PIGCLAUDE_TEST_HTTP_PROXY_URL: ${{ secrets.PIGCLAUDE_XRAY_LIVE_HTTP_PROXY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PIGCLAUDE_TEST_HTTP_PROXY_URL)) { throw "缺少 HTTP 测试代理" }
          $proxy = [Uri]$env:PIGCLAUDE_TEST_HTTP_PROXY_URL
          $parts = @($proxy.Host, $proxy.UserInfo) + @($proxy.UserInfo.Split(':', 2))
          foreach ($part in $parts) {
            $value = [Uri]::UnescapeDataString($part)
            if ($value) {
              $escaped = $value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::add-mask::$escaped"
            }
          }
          pnpm exec vitest run --maxWorkers=1 src/main/claude/fingerprint-chromium-live-http-proxy.integration.test.ts
          exit $LASTEXITCODE
      - name: 使用真实 HTTPS 上游代理验证 HTTPS 目标
        if: github.ref == 'refs/heads/codex/issue9-live-https-proxy'
        working-directory: apps/desktop
        shell: pwsh
        env:
          PIGCLAUDE_TEST_LIVE_HTTPS_PROXY: "1"
          PIGCLAUDE_TEST_HTTPS_PROXY_URL: ${{ secrets.PIGCLAUDE_XRAY_LIVE_HTTPS_PROXY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PIGCLAUDE_TEST_HTTPS_PROXY_URL)) { throw "缺少 HTTPS 测试代理" }
          $proxy = [Uri]$env:PIGCLAUDE_TEST_HTTPS_PROXY_URL
          $parts = @($proxy.Host, $proxy.UserInfo) + @($proxy.UserInfo.Split(':', 2))
          foreach ($part in $parts) {
            $value = [Uri]::UnescapeDataString($part)
            if ($value) {
              $escaped = $value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::add-mask::$escaped"
            }
          }
          pnpm exec vitest run --maxWorkers=1 src/main/claude/fingerprint-chromium-live-https-proxy.integration.test.ts
          exit $LASTEXITCODE
      - name: 移除临时 Windows 证书
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $cert = Join-Path $env:GITHUB_WORKSPACE "packages/login-gate/src/test-fixtures/loopback-ip-synthetic-cert.pem"
          if (Test-Path $cert) {
            $fingerprint = (Get-PfxCertificate -FilePath $cert).Thumbprint
            $installed = "Cert:\LocalMachine\Root\$fingerprint"
            if (Test-Path $installed) {
              certutil.exe -f -delstore Root $fingerprint
              if ($LASTEXITCODE -ne 0 -or (Test-Path $installed)) { throw "证书移除失败" }
            }
          }
      - name: 移除临时 Linux 证书
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if command -v certutil >/dev/null && [ -f "$HOME/.pki/nssdb/cert9.db" ] && certutil -L -d "sql:$HOME/.pki/nssdb" -n pigclaude-synthetic >/dev/null 2>&1; then
            certutil -D -d "sql:$HOME/.pki/nssdb" -n pigclaude-synthetic
          fi
