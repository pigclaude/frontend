# 独立运行器上的 test.16 安装与默认浏览器入口预检。
name: Verify test.16 Windows draft install

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-win32-x64
          path: ${{ runner.temp }}/draft
          repository: pigclaude/frontend
          run-id: 44650067015
          github-token: ${{ github.token }}
      - name: 核对并安装最终制品
        shell: pwsh
        run: ./tests/windows-draft-install-test16.ps1
      - name: 保存脱敏验收结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test16-preflight
          path: ${{ runner.temp }}/test16-proof
          if-no-files-found: ignore
